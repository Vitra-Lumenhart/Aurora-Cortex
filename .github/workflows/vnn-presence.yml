name: VNN presence contract
on:
  pull_request:
    paths:
      - 'broadcast.py'
      - 'vnn/**'
      - 'tests/test_vnn_presence.py'
      - '.github/workflows/vnn-presence.yml'
  push:
    branches:
      - feature/vnn-presence-2026-11-11
    paths:
      - 'broadcast.py'
      - 'vnn/**'
      - 'tests/test_vnn_presence.py'
      - '.github/workflows/vnn-presence.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile broadcast.py vnn/presence.py tests/test_vnn_presence.py
      - name: VNN contract tests
        run: python -m unittest discover -s tests -p 'test_vnn_*.py' -v
      - name: Check browser adapter JavaScript syntax
        run: node --check vnn/presence-client.js
      - name: Run existing broadcast rehearsal
        run: python broadcast.py demo
